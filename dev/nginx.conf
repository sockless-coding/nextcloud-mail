# The reverse proxy in front of Nextcloud. The /exapps/ rule is what every HaRP setup needs:
# browsers and AppAPI itself reach ExApps through <nextcloud_url>/exapps/<appid>/.
server {
    listen 80;
    client_max_body_size 512M;

    # Resolve upstreams per request, so nginx starts even while a container is down.
    resolver 127.0.0.11 valid=10s;
    set $harp_upstream http://harp:8780;
    set $nextcloud_upstream http://nextcloud:80;

    location /exapps/ {
        proxy_pass $harp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_buffering off;
    }

    location / {
        proxy_pass $nextcloud_upstream;
        # $http_host keeps the port, so Nextcloud builds correct redirect URLs for localhost:8180.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
